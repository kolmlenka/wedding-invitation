
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wedding Invitation</title>
    <meta name="description" content="A special invitation to celebrate our wedding.">

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main class="hero">

        <div class="hero-content">

            <p class="eyebrow">ВМЕСТЕ С ИХ СЕМЬЯМИ</p>

            <h1 class="names">
                Анастасия<br>
                +<br>
                Дмитрий
            </h1>

            <div class="divider"></div>

            <p class="invitation-text">
                ПРИГЛАШАЕМ ВАС НА ПРАЗДНОВАНИЕ<br>
                НАШЕГО СВАДЕБНОГО ДНЯ
            </p>

            <p class="wedding-date">10 · 07 · 2027</p>

            <button class="open-button" id="openInvitation">
                ОТКЫТЬ ПРИГЛАШЕНИЕ
            </button>

        </div>

        <p class="bottom-note">A DAY TO REMEMBER</p>

    </main>

    <script src="js/script.js"></script>
</body>
</html>
