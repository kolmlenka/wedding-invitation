
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#35121F">

    <title>Alexander & Victoria — Wedding Invitation</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Opening screen -->
    <section class="intro-screen" id="introScreen">

        <div class="envelope" id="envelope">

            <div class="envelope-back"></div>

            <div class="envelope-letter">
                <p>Вы приглашены</p>
            </div>

            <div class="envelope-flap"></div>
            <div class="envelope-front"></div>

            <div class="envelope-seal">
                <span>A+D</span>
            </div>

        </div>

        <button class="open-button" id="openInvitation">
            Открыть приглашение
        </button>

    </section>


    <!-- Main invitation -->
    <main class="invitation" id="invitation">

        <!-- Music player -->
        <div class="music-player">

            <button
                id="musicToggle"
                class="music-button"
                type="button"
                aria-label="Pause music"
            >
                <span id="musicIcon">Ⅱ</span>
            </button>

            <div class="music-info">
                <span class="music-title">Наша песня</span>
                <span class="music-status" id="musicStatus">
                    Now playing
                </span>
            </div>

            <input
                type="range"
                id="volumeControl"
                min="0"
                max="1"
                step="0.01"
                value="0.5"
                aria-label="Volume"
            >

        </div>


        <!-- Hero section -->
        <section class="hero">

            <h1 class="couple-names">
                Анастасия<br>
                <span>&</span>
                Дмитрий<br>
            </h1>

            <div class="hero-divider"></div>

            <p class="invitation-text">
                Приглашаем вас разделить этот<br>
                замечательный день с нами<br>
            </p>

            <p class="wedding-date">
                10 · 07 · 2027
            </p>

            <p class="wedding-location">
                Москва, Россия
            </p>

        </section>

    </main>


    <!-- Background music -->
    <audio id="backgroundMusic" loop preload="auto">
        <source src="assets/audio/music.mp3" type="audio/mpeg">
        Your browser does not support audio playback.
    </audio>


    <script src="js/script.js"></script>

</body>
</html>
